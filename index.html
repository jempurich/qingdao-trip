<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Qingdao Weihai Trip</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#BFE6F5">
<meta name="description" content="แพลนทริป Qingdao และ Weihai 22-25 ก.ย.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Qingdao Trip">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@500;600;700&family=Noto+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--sea:#BFE6F5;--sea2:#7CCBE8;--ink:#17435A;--text:#2B3A4A;--sub:#4A5D6E;--cream:#FFF6E9;--edge:#F0DFC6;--blue:#1B78A3;--blue-d:#125778;--day:#2A8CB5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--cream);font-family:'Noto Sans Thai',sans-serif;color:var(--text);max-width:520px;margin:0 auto;padding-bottom:calc(40px + env(safe-area-inset-bottom));min-height:100vh}
a{color:var(--blue)}
button{font-family:inherit}
.hero{position:relative;background:var(--sea);padding:calc(44px + env(safe-area-inset-top)) 24px 0;overflow:hidden}
.pill{display:inline-block;background:#fff;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600;color:#1B5F80}
h1{margin:14px 0 6px;font-family:'Mali',sans-serif;font-weight:700;font-size:38px;line-height:1.15;color:var(--ink)}
.hero p{margin:0 0 22px;font-size:15px;line-height:1.6;color:#2F5568}
.sun{position:absolute;top:-30px;right:-26px}
.cloud{position:absolute;top:60px;left:226px;animation:drift 9s ease-in-out infinite alternate}
.boat{position:absolute;right:34px;bottom:26px;animation:bob 3.2s ease-in-out infinite}
@keyframes drift{to{transform:translateX(-24px)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-4px) rotate(2deg)}}
.waves{display:block;margin-bottom:-1px}
.wrap{padding:8px 20px 0}
.card{background:#fff;border-radius:22px;box-shadow:0 3px 0 var(--edge)}
.route{display:flex;align-items:center;justify-content:space-between;border-radius:20px;padding:14px 16px}
.stop{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--sub)}
.dot{width:12px;height:12px;border-radius:999px}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:20px;padding-bottom:3px}
.tab{min-width:0;min-height:64px;border:0;border-radius:18px;padding:8px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:#fff;color:#1B5F80;box-shadow:0 3px 0 var(--edge);transition:transform .15s}
.tab:active{transform:translateY(2px);box-shadow:0 1px 0 var(--edge)}
.tab[aria-pressed=true]{background:var(--blue);color:#fff;box-shadow:0 3px 0 var(--blue-d)}
.tab span:first-child{font-size:12px;font-weight:500}
.tab span:last-child{font-family:'Mali',sans-serif;font-size:20px;font-weight:700;line-height:1.1}
#day{margin-top:22px;display:flex;flex-direction:column;gap:16px;animation:pop .35s ease}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.title{font-family:'Mali',sans-serif;font-weight:700;font-size:26px;line-height:1.25;color:var(--ink)}
.city{margin-top:6px;display:inline-block;background:#FFE3D6;color:#8A3A1B;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600}
.fl-head{background:#FFD66B;padding:10px 18px;display:flex;align-items:center;justify-content:space-between;color:#4A3500;font-family:'Mali',sans-serif;font-weight:700;font-size:16px;border-radius:22px 22px 0 0}
.fl-body{padding:18px;display:flex;align-items:center;justify-content:space-between}
.fl-body .code{font-family:'Mali',sans-serif;font-weight:700;font-size:30px;color:var(--ink);line-height:1}
.fl-body .time{font-size:20px;font-weight:600;margin-top:6px}
.fl-body .nm{font-size:12px;color:var(--sub);margin-top:2px}
.fl-note{border-top:2px dashed var(--edge);padding:12px 18px;font-size:13px;color:var(--sub);line-height:1.5}
.plan{padding:20px 18px}
.plan h2{margin:0;font-family:'Mali',sans-serif;font-weight:700;font-size:18px;color:var(--ink)}
.plan .hint{font-size:12px;color:var(--sub);margin:2px 0 16px;line-height:1.5}
.item{display:flex;gap:14px}
.rail{display:flex;flex-direction:column;align-items:center}
.num{width:30px;height:30px;border-radius:999px;background:var(--day);color:#fff;font-family:'Mali',sans-serif;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.line{width:3px;flex-grow:1;background:#E6EEF2;border-radius:2px;margin:4px 0;min-height:10px}
.item:last-child .line{display:none}
.body{padding-bottom:14px;flex-grow:1;min-width:0}
.tag{display:inline-block;background:#E4F4FB;color:#17566F;border-radius:8px;padding:2px 8px;font-size:12px;font-weight:600;margin-bottom:4px}
.what{font-size:15px;line-height:1.55;font-weight:600;padding-top:3px}
.note{font-size:13px;line-height:1.55;color:var(--sub);margin-top:2px}
.map{display:inline-flex;align-items:center;gap:6px;min-height:44px;margin-top:4px;padding:0 14px;border-radius:999px;background:#E4F4FB;color:var(--blue-d);font-size:13px;font-weight:600;text-decoration:none}
.hotel{background:#E5F6EC;border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:12px}
.hotel .row{display:flex;align-items:center;gap:10px}
.hotel .ic{width:40px;height:40px;border-radius:14px;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.hotel small{display:block;font-size:12px;font-weight:600;color:#1F6B45}
.hotel b{font-family:'Mali',sans-serif;font-size:17px;color:var(--ink);line-height:1.3}
.hotel a{display:flex;align-items:center;justify-content:center;min-height:46px;border-radius:999px;background:#1F7A4D;color:#fff;font-size:15px;font-weight:600;text-decoration:none}
.bye{text-align:center;margin-top:28px;font-family:'Mali',sans-serif;font-weight:600;font-size:15px;color:var(--sub)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="hero">
<svg class="sun" width="120" height="120" viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="40" fill="#FFD66B"/><circle cx="60" cy="60" r="54" fill="none" stroke="#FFD66B" stroke-width="3" stroke-dasharray="4 8" stroke-linecap="round"/></svg>
<svg class="cloud" width="70" height="30" viewBox="0 0 70 30" aria-hidden="true"><path d="M8 26 C0 26 0 14 10 14 C11 6 24 4 27 12 C32 6 44 8 44 16 C52 14 56 26 46 26 Z" fill="#fff"/></svg>
<div class="pill">4 วัน 3 คืน · 22-25 ก.ย.</div>
<h1>ชิงเต่า<br>ไหว่ไห่ ทริป</h1>
<p>เที่ยวทะเลจีน กินอาหารทะเล<br>ตามล่าพระอาทิตย์ตกกัน</p>
<svg class="waves" width="100%" height="64" viewBox="0 0 390 64" preserveAspectRatio="none" aria-hidden="true"><path d="M0 30 C40 8 80 8 120 30 C160 52 200 52 240 30 C280 8 320 8 360 30 C375 38 385 40 390 38 L390 64 L0 64 Z" fill="#7CCBE8"/><path d="M0 44 C40 26 80 26 120 44 C160 62 200 62 240 44 C280 26 320 26 360 44 C375 50 385 52 390 50 L390 64 L0 64 Z" fill="#FFF6E9"/></svg>
<svg class="boat" width="64" height="64" viewBox="0 0 64 64" aria-hidden="true"><path d="M32 6 L32 40" stroke="#17435A" stroke-width="3" stroke-linecap="round"/><path d="M34 8 L52 36 L34 36 Z" fill="#FF9E80"/><path d="M30 14 L16 36 L30 36 Z" fill="#fff"/><path d="M12 40 L52 40 L46 50 L18 50 Z" fill="#17435A"/></svg>
</header>

<main class="wrap">
<div class="card route" id="route"></div>
<div class="tabs" id="tabs" role="group" aria-label="เลือกวัน"></div>
<div id="day" aria-live="polite"></div>
<div class="bye">เที่ยวให้สนุกนะ</div>
</main>

<script>
(function () {
  var colors = ['#2A8CB5', '#E8735A', '#3FA57A', '#B8860B'];
  var AM = 'https://uri.amap.com/search?keyword=';
  var H1 = 'https://surl.amap.com/1xiMflwEfDr';
  var H2 = 'https://www.trip.com/w/q8BEYreOQW2';
  var days = [
    { label: 'วันที่ 1', date: '22 ก.ย.', city: 'Qingdao', title: 'บินถึงแล้ว ชิงเต่า',
      flights: [{ code: 'SC4080', fc: 'BKK', ft: '02:50', fn: 'สุวรรณภูมิ', tc: 'TAO', tt: '08:25', tn: 'Qingdao Jiaodong', note: 'Economy · Boeing 737-800 · มีมื้ออาหาร' }],
      items: [
        { time: '08:25', text: 'ถึงสนามบิน Qingdao Jiaodong', note: 'ผ่านตม. รับกระเป๋า แล้วเดินทางเข้าเมือง', map: ['青岛胶东国际机场'] },
        { time: 'ประมาณ 10:30', text: 'เข้าโรงแรมพัก', note: 'ถ้าห้องยังไม่พร้อม ฝากกระเป๋าไว้ก่อนแล้วไปหาอะไรกิน', hotelMap: true },
        { time: 'ประมาณ 15:00', text: 'May Fourth Square', note: 'จัตุรัสริมทะเล มีประติมากรรมลูกบอลสีแดง May Wind ถ่ายรูปสวย', map: ['五四广场'] },
        { time: 'ประมาณ 17:30', text: 'Olympic Sailing Center', note: 'ท่าเรือใบโอลิมปิก เดินเล่นชมเรือและพระอาทิตย์ตก', map: ['青岛奥帆中心'] },
        { time: '', text: 'กลับโรงแรม นอน Qingdao' }
      ],
      hotel: 'Qingdao Haitian Grand Hotel', hotelUrl: H1, hotelLink: 'เปิดแผนที่ Amap' },
    { label: 'วันที่ 2', date: '23 ก.ย.', city: 'Qingdao', title: 'เดินเล่นเมืองเก่าริมทะเล',
      flights: [],
      items: [
        { time: 'ประมาณ 09:30', text: 'Old Town', note: 'ย่านเมืองเก่า ถนนจงซาน (Zhongshan Road) อาคารสไตล์เยอรมัน', map: ['中山路', '青岛'] },
        { time: 'ประมาณ 11:30', text: 'Zhanqiao', note: 'สะพานท่าเรือสัญลักษณ์เมืองชิงเต่า ยื่นออกไปในทะเล', map: ['栈桥'] },
        { time: 'ประมาณ 14:00', text: 'Badaguan', note: 'ย่านวิลล่าเก่าร่มรื่น เดินถ่ายรูปชิลๆ', map: ['八大关'] },
        { time: 'ประมาณ 16:30', text: 'Second Beach', note: 'ชายหาดใกล้ Badaguan นั่งพักรับลมทะเล', map: ['第二海水浴场'] },
        { time: '', text: 'กลับโรงแรม นอน Qingdao', hotelMap: true }
      ],
      hotel: 'Qingdao Haitian Grand Hotel', hotelUrl: H1, hotelLink: 'เปิดแผนที่ Amap' },
    { label: 'วันที่ 3', date: '24 ก.ย.', city: 'Qingdao → Weihai', title: 'นั่งรถไฟไป ไหว่ไห่',
      flights: [],
      items: [
        { time: 'ประมาณ 08:00-09:00', text: 'นั่งรถไฟความเร็วสูงไป Weihai', note: 'จองตั๋วล่วงหน้า และมาถึงสถานีก่อนเวลาสักครึ่งชั่วโมง' },
        { time: 'ประมาณ 11:30', text: 'ฝากกระเป๋าโรงแรม', note: 'Luxury Blue Horizon Hotel Weihai', hotelMap: true },
        { time: 'ประมาณ 13:00', text: 'Torch 8th Street', note: 'ถนนคนเดินสายกิน ของกินและร้านเล็กๆ เยอะ', map: ['火炬八街'] },
        { time: 'ประมาณ 15:00', text: 'International Bathing Beach', note: 'หาดในเมืองไหว่ไห่ น้ำทะเลใส', map: ['威海国际海水浴场'] },
        { time: 'ประมาณ 16:00', text: 'ถนนเลียบทะเล', note: 'เดินหรือปั่นชมวิวทะเลตลอดทาง', map: ['威海滨海路'] },
        { time: 'ประมาณ 17:00', text: 'Weihai Park', note: 'สวนริมทะเล เดินต่อไปดูพระอาทิตย์ตก', map: ['威海公园'] },
        { time: 'ประมาณ 18:00', text: 'ดูพระอาทิตย์ตก', note: 'ช่วงปลายเดือนกันยายนพระอาทิตย์ตกราว 18:00 ไปรอก่อนสัก 20 นาที' },
        { time: '', text: 'กลับโรงแรม นอน Weihai 1 คืน', hotelMap: true }
      ],
      hotel: 'Luxury Blue Horizon Hotel Weihai', hotelUrl: H2, hotelLink: 'เปิดลิงก์ Trip.com' },
    { label: 'วันที่ 4', date: '25 ก.ย.', city: 'Weihai → Qingdao → BKK', title: 'ขากลับบ้าน',
      flights: [{ code: 'SC4079', fc: 'TAO', ft: '21:55', fn: 'Qingdao Jiaodong', tc: 'BKK', tt: '01:50', tn: 'สุวรรณภูมิ (26 ก.ย.)', note: 'Economy · Boeing 737-800 · มีขนม' }],
      items: [
        { time: 'ประมาณ 09:30', text: 'ตื่นสาย กิน Breakfast', note: 'เช็กเอาต์แล้วฝากกระเป๋าไว้ที่โรงแรมได้' },
        { time: 'ประมาณ 10:30', text: 'เที่ยว/คาเฟ่อีกนิด', note: 'หาคาเฟ่ริมทะเลนั่งชิลๆ ก่อนกลับ' },
        { time: 'ประมาณ 12:00', text: 'นั่งรถไฟกลับ Qingdao', note: 'รับกระเป๋าจากโรงแรมก่อนไปสถานี' },
        { time: 'ประมาณ 15:00', text: 'ถึง Qingdao รับกระเป๋า', note: 'ถ้ามีเวลาเหลือ แวะกินข้าวเย็นก่อนไปสนามบิน' },
        { time: 'ประมาณ 18:30', text: 'เดินทางไปสนามบิน', note: 'เครื่องออก 21:55 ควรถึงสนามบินอย่างน้อย 3 ชั่วโมงก่อนบิน', map: ['青岛胶东国际机场'] }
      ],
      hotel: '' }
  ];
  var route = [['BKK', '#FFD66B'], ['Qingdao', '#2A8CB5'], ['Weihai', '#E8735A'], ['Qingdao', '#2A8CB5'], ['BKK', '#FFD66B']];

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  var pin = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#125778" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21 C12 21 5 14.5 5 9.5 A7 7 0 0 1 19 9.5 C19 14.5 12 21 12 21 Z"/><circle cx="12" cy="9.5" r="2.5"/></svg>';
  var plane = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4A3500" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 16 L22 8 M10 9 L6 4 M12 15 L9 21"/></svg>';
  var arrow = '<svg width="60" height="16" viewBox="0 0 60 16" fill="none" aria-hidden="true"><path d="M2 8 L52 8" stroke="#7CCBE8" stroke-width="3" stroke-dasharray="2 6" stroke-linecap="round"/><path d="M48 2 L57 8 L48 14" stroke="#7CCBE8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var bed = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1F7A4D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 19 L3 8 M3 15 L21 15 L21 19 M21 15 L21 11 C21 9 19 9 17 9 L11 9 L11 15 M7 12 A1.5 1.5 0 1 0 7.01 12"/></svg>';

  document.getElementById('route').innerHTML = route.map(function (r) {
    return '<div class="stop"><div class="dot" style="background:' + r[1] + '"></div>' + r[0] + '</div>';
  }).join('');

  function mapUrl(it, d) {
    if (it.hotelMap && d.hotelUrl) return d.hotelUrl;
    if (it.map) return AM + encodeURIComponent(it.map[0]) + (it.map[1] ? '&city=' + encodeURIComponent(it.map[1]) : '');
    return '';
  }

  function render(i) {
    var d = days[i];
    document.getElementById('tabs').innerHTML = days.map(function (x, k) {
      return '<button class="tab" data-i="' + k + '" aria-pressed="' + (k === i) + '"><span>' + x.label + '</span><span>' + x.date + '</span></button>';
    }).join('');
    var h = '<div><div class="title">' + esc(d.title) + '</div><div class="city">' + esc(d.city) + '</div></div>';
    d.flights.forEach(function (f) {
      h += '<div class="card"><div class="fl-head"><span>' + f.code + ' Shandong Airlines</span>' + plane + '</div>' +
        '<div class="fl-body"><div><div class="code">' + f.fc + '</div><div class="time">' + f.ft + '</div><div class="nm">' + esc(f.fn) + '</div></div>' + arrow +
        '<div style="text-align:right"><div class="code">' + f.tc + '</div><div class="time">' + f.tt + '</div><div class="nm">' + esc(f.tn) + '</div></div></div>' +
        '<div class="fl-note">' + esc(f.note) + '</div></div>';
    });
    h += '<div class="card plan" style="--day:' + colors[i] + '"><h2>แผนวันนี้</h2><div class="hint">เวลาที่มี "ประมาณ" เป็นเวลาที่แนะนำ ปรับได้ตามสะดวก</div>';
    d.items.forEach(function (it, n) {
      var u = mapUrl(it, d);
      h += '<div class="item"><div class="rail"><div class="num">' + (n + 1) + '</div><div class="line"></div></div><div class="body">' +
        (it.time ? '<div class="tag">' + esc(it.time) + '</div>' : '') +
        '<div class="what">' + esc(it.text) + '</div>' +
        (it.note ? '<div class="note">' + esc(it.note) + '</div>' : '') +
        (u ? '<a class="map" href="' + u + '" target="_blank" rel="noopener">' + pin + 'เปิดใน Amap</a>' : '') +
        '</div></div>';
    });
    h += '</div>';
    if (d.hotel) {
      h += '<div class="hotel"><div class="row"><div class="ic">' + bed + '</div><div><small>ที่พัก</small><b>' + esc(d.hotel) + '</b></div></div>' +
        '<a href="' + d.hotelUrl + '" target="_blank" rel="noopener">' + esc(d.hotelLink) + '</a></div>';
    }
    var el = document.getElementById('day');
    el.innerHTML = h;
    el.style.animation = 'none'; void el.offsetWidth; el.style.animation = '';
    try { localStorage.setItem('qd-day', i); } catch (e) {}
  }

  document.getElementById('tabs').addEventListener('click', function (e) {
    var b = e.target.closest('.tab');
    if (b) render(+b.dataset.i);
  });

  var start = 0, now = new Date();
  if (now.getMonth() === 8 && now.getDate() >= 22 && now.getDate() <= 25) start = now.getDate() - 22;
  else { try { start = +localStorage.getItem('qd-day') || 0; } catch (e) {} }
  render(start);

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js'); });
  }
})();
</script>
</body>
</html>
